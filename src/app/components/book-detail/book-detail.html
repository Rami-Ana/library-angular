<article>
    @if(book){
    <ul>
        <img src="{{book.coverImage}}" alt="image test">
        <h1>{{book.title}}</h1>
        <h3>By: {{book.author}}</h3>

        <hr>
        <q>{{book.description}}</q><br>
        <p><label class="bold-text">Genre: </label>{{book.genre}}</p>
        <p><label class="bold-text">Year: </label>{{book.publishedYear}}</p>
        <p><label class="bold-text">ISBN: </label>{{book.isbn}}</p>
        <p><label class="bold-text">Id: </label>{{book.id}}</p>
        <hr>
    </ul>
    }
    @else {<p>Book dont found</p>}

    <a href="/">← Back to gallery</a>
</article>
